# 取得 Cloudflare Tunnel 後方的真實訪客 IP（本機連線則退回 $remote_addr）
map $http_cf_connecting_ip $client_real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# API 速率限制：單一 IP 平均每秒 8 次請求，允許突發 24 次（足以應付初次開啟頁面的並發查詢）
limit_req_zone $client_real_ip zone=api_limit:10m rate=8r/s;

server {
    listen 80;
    server_tokens off;

    # 啟用 Gzip 壓縮以大幅節省家用網路上傳頻寬
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        text/javascript
        image/svg+xml;

    # 基本安全 HTTP 標頭
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 靜態編譯資源（含內容雜湊，可安全長快取）
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 前端與靜態檔案（ads.txt / robots.txt / GeoJSON）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # FastAPI 反向代理（含速率限制與超時防護）
    location /api/ {
        limit_req zone=api_limit burst=24 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 45s;
    }
}
